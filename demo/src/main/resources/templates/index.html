<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Spring</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
        <link rel="stylesheet" type="text/css" href="/styles.css">
    </head>

    <meta charset="UTF-8">
    <body style="display: grid"> 
        <div class="section1">
            <div class="homeText">
                <!--<p th:text="'Hey there, ' + ${user.firstname}"></p>-->
                <p>My First Spring !</p>
                <p class="credit">By quan afoon</p>
            </div>
        </div>
        <div class="section2">
            <h1> Login </h1>
            <form th:action="@{/login}" th:object="${user}" method="post" class= "loginForm" >
                <div class="input-field">
                    <input class="formField" style="text-align:center" type="text" id="firstname" th:field="*{firstname}" placeholder="firstname" required>
                </div>
                <div class="input-field">
                    <input class="formField" type="text" id="lastname" th:field="*{lastname}" placeholder="lastname" required>
                </div>
                <button type="submit" style="background-color: #38da84" class="btn" id="loginBtn">Login</button>
            </form>
            <div style="display: flex; margin-top:10vh">
                <p class="simpleText"> Don't have an account? </p>
                <button style="margin-left: 1vw; background-color: #38da84;" class="btn-small"> Sign up </button>
            </div>
        </div>
        
        <div id="flash-message" th:text="${message}" style="display:none;"> </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
        <script>
            M.AutoInit();
            var message = document.getElementById("flash-message").textContent;
            if(message){
                M.toast({html:message})
            }
        </script>
    </body>
</html>
